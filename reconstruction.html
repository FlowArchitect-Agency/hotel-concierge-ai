<!doctype html>
<meta charset="utf-8">
<title>Notre-Dame — reconstruction</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#efe9dc; --forest:#3b4a3f; --gold:#e4c48c; }
  *{box-sizing:border-box}
  html{overflow-x:clip}
  body{margin:0;background:var(--cream);color:var(--forest);
       font-family:'Manrope',system-ui,sans-serif;overflow-x:clip}
  .spacer{height:70vh;display:grid;place-items:center;opacity:.4;
          font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .scene{position:relative;height:600vh}
  .pin{position:sticky;top:0;height:100vh;overflow:hidden;
       background:linear-gradient(#9dc0da 0%, #cfdce2 46%, #e8e3d6 78%, #efe9dc 100%)}
  canvas{display:block;width:100%;height:100%}
  .cap{position:absolute;left:6vw;top:50%;transform:translateY(-50%);
       width:min(26vw,20ch);z-index:3;pointer-events:none;color:#2f3a32}
  .cap p{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
         color:#9d7a49;opacity:.95}
  .cap h2{margin:.6rem 0 0;font-family:'Fraunces',Georgia,serif;font-weight:300;
          font-size:clamp(1.8rem,3.4vw,3.1rem);line-height:1.02;letter-spacing:-.03em}
  .cap .step{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}
  .cap .step.on{opacity:1;position:relative}
  .load{position:absolute;inset:0;display:grid;place-items:center;z-index:4;
        color:#3b4a3f;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
        transition:opacity .6s ease}
  .load.done{opacity:0;pointer-events:none}
</style>

<div class="spacer">scroll down</div>

<section class="scene" id="scene">
  <div class="pin">
    <canvas id="c"></canvas>
    <div class="load" id="load">building&hellip; <span id="pct">0%</span></div>
    <div class="cap" id="cap">
      <p id="capnum">05 — Human handoff</p>
      <h2 id="captxt">Rebuilt by hand.</h2>
    </div>
  </div>
</section>

<div class="spacer">keep scrolling</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
/* ---------------------------------------------------------------------------
   Notre-Dame, reconstructed on scroll.

   Uses the real photogrammetry mesh rather than boxes: hand-built axis-aligned
   geometry cannot describe Gothic architecture, which is arches, tracery and
   spires. That attempt read as a factory and was abandoned.

   The mesh is one continuous scanned surface with no separable parts, so doors
   and windows cannot fly in independently. What DOES work on a single mesh is
   assembling the whole thing from its own points: 59k vertices scatter into
   space and converge into solid stone as you scroll. It suits the subject
   twice over -- this model was crowdsourced from thousands of photographs, and
   the cathedral itself was being rebuilt.
   ------------------------------------------------------------------------ */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const canvas = document.getElementById('c');
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 4000);
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;

scene.add(new THREE.HemisphereLight(0xdff0ff, 0xb9ad93, 2.0));
const key = new THREE.DirectionalLight(0xfff4e2, 3.0);
key.position.set(-70, 120, 90);
scene.add(key);
const rim = new THREE.DirectionalLight(0xbdd8f0, 1.3);
rim.position.set(90, 40, -80);
scene.add(rim);

function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h){
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

// ---- scroll-driven assembly shader --------------------------------------
// Each vertex is pushed out along a stable pseudo-random direction by an
// amount the scroll controls, so the building disperses and re-forms without
// needing separable parts.
const uniforms = { uAssemble:{ value:0 }, uRadius:{ value:45 } };
function patch(mat){
  mat.onBeforeCompile = (sh)=>{
    sh.uniforms.uAssemble = uniforms.uAssemble;
    sh.uniforms.uRadius = uniforms.uRadius;
    sh.vertexShader = `
      uniform float uAssemble;
      uniform float uRadius;
      float h31(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719))) * 43758.5453); }
    ` + sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      float rr = h31(floor(position * 0.35));
      vec3 dir = normalize(vec3(h31(position.yzx)-0.5, h31(position.zxy)-0.5, h31(position.xyz)-0.5) + 1e-4);
      float amt = pow(1.0 - uAssemble, 1.7) * uRadius * (0.10 + rr * 0.30);
      transformed += dir * amt;
    `);
    mat.userData.shader = sh;
  };
  mat.needsUpdate = true;
}

let model = null, points = null, radius = 60, centre = new THREE.Vector3();

const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const loadEl = document.getElementById('load');
const pctEl  = document.getElementById('pct');

// The scan is Z-up with the building's 128m length running along Y -- the
// RealityCapture export convention. three.js is Y-up, so untouched it stands on
// its west front with the nave pointing at the sky. Rotate it onto its feet
// inside a wrapper, so the wrapper stays axis-aligned for centring.
function stand(obj){
  const g = new THREE.Group();
  obj.rotation.x = -Math.PI / 2;
  g.add(obj);
  return g;
}

loader.load('assets/3d/notredame.glb', (gltf)=>{
  model = stand(gltf.scene);
  const box = new THREE.Box3().setFromObject(model);
  box.getCenter(centre);
  // frame on the bounding sphere, not the longest edge: the nave is nearly
  // twice the height, and the longest edge pushes the camera far too far back.
  radius = box.getBoundingSphere(new THREE.Sphere()).radius;
  uniforms.uRadius.value = radius;
  model.position.sub(centre);                 // centre on the origin

  const pos = [];
  model.traverse(o=>{
    if (!o.isMesh) return;
    o.material.side = THREE.DoubleSide;
    patch(o.material);
    const p = o.geometry.attributes.position;
    for (let i = 0; i < p.count; i += 2) pos.push(p.getX(i), p.getY(i), p.getZ(i));
  });

  // the same vertices as a drifting point cloud, shown while dispersed
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  points = new THREE.Points(g, new THREE.PointsMaterial({
    color:0x8a7f66, size: radius*0.0042, transparent:true, opacity:0, depthWrite:false }));
  patch(points.material);
  const cloud = stand(points);                // same orientation as the mesh
  cloud.position.copy(model.position);
  scene.add(cloud);
  scene.add(model);

  loadEl.classList.add('done');
  onScroll();
  Object.assign(cur, target);
}, (e)=>{
  if (e.total) pctEl.textContent = Math.round(e.loaded/e.total*100) + '%';
}, (err)=>{ loadEl.textContent = 'model failed to load'; console.error(err); });

// ---- camera tour --------------------------------------------------------
// Waypoints are expressed in radii so they hold whatever the model's scale is.
const STOPS = [
// Azimuths stay on the north-west arc. This model was crowdsourced from
// tourist photographs, so coverage follows where people stood: the west front
// and the north elevation are sharp, the south side is a dark, sparse guess.
  { az:3.85, el:0.20, dist:3.05, num:'05 — Human handoff',   txt:'Rebuilt by hand.' },
  { az:3.28, el:0.06, dist:2.35, num:'The west front',        txt:'AI when it can.' },
  { az:4.15, el:0.11, dist:2.30, num:'The flying buttresses', txt:'People when it matters.' },
  { az:4.80, el:0.16, dist:2.55, num:'Notre-Dame de Paris',   txt:'Never impersonating the hotel.' },
];
const capNum = document.getElementById('capnum');
const capTxt = document.getElementById('captxt');
let shown = -1;

const lerp = (a,b,t)=>a+(b-a)*t;
const easeInOut = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

let target = { az:STOPS[0].az, el:STOPS[0].el, dist:STOPS[0].dist, assemble:0 };
const cur = { ...target };

function onScroll(){
  const s = document.getElementById('scene').getBoundingClientRect();
  const span = s.height - innerHeight;
  const p = Math.min(1, Math.max(0, -s.top / (span || 1)));

  // assembly happens over the first third, then the tour continues
  target.assemble = Math.min(1, p / 0.22);   // solid by 22%, then holds

  const seg = Math.min(STOPS.length-2, Math.floor(p * (STOPS.length-1)));
  const local = easeInOut(Math.min(1, Math.max(0, p*(STOPS.length-1) - seg)));
  const a = STOPS[seg], b = STOPS[seg+1];
  target.az   = lerp(a.az,   b.az,   local);
  target.el   = lerp(a.el,   b.el,   local);
  target.dist = lerp(a.dist, b.dist, local);

  const idx = local > 0.5 ? seg+1 : seg;
  if (idx !== shown){
    shown = idx;
    capNum.textContent = STOPS[idx].num;
    capTxt.textContent = STOPS[idx].txt;
  }
}
addEventListener('scroll', onScroll, { passive:true });
addEventListener('resize', onScroll);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let last = performance.now();
function frame(now){
  now = now || performance.now();
  // time-based smoothing, not per-frame: a throttled or low frame rate must not
  // change how long the assembly takes to settle.
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  resize();
  const k = reduce ? 1 : 1 - Math.exp(-4.7 * dt);
  cur.az   = lerp(cur.az,   target.az,   k);
  cur.el   = lerp(cur.el,   target.el,   k);
  cur.dist = lerp(cur.dist, target.dist, k);
  cur.assemble = lerp(cur.assemble, target.assemble, k);

  uniforms.uAssemble.value = cur.assemble;
  for (const o of [model, points]) o && o.traverse?.(n=>{
    const sh = n.material?.userData?.shader;
    if (sh) sh.uniforms.uAssemble.value = cur.assemble;
  });
  if (points){
    const sh = points.material.userData?.shader;
    if (sh) sh.uniforms.uAssemble.value = cur.assemble;
    points.material.opacity = Math.max(0, 1 - cur.assemble*1.25);
  }
  if (model) model.visible = cur.assemble > 0.04;

  const d = radius * cur.dist;
  camera.position.set(
    Math.sin(cur.az) * Math.cos(cur.el) * d,
    Math.sin(cur.el) * d + radius*0.06,
    Math.cos(cur.az) * Math.cos(cur.el) * d);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
// coming back to a backgrounded tab should show the current scroll position,
// not replay the catch-up from wherever rAF was paused.
addEventListener('visibilitychange', ()=>{
  last = performance.now();
  if (!document.hidden){ onScroll(); Object.assign(cur, target); }
});

window.__nd3d = {
  ready: ()=>!!model,
  snap: ()=>{ onScroll(); Object.assign(cur, target); },
  // holds until the next scroll event -- for choosing waypoints by eye
  orbit: (az, el, dist)=>{ target.az = az;
    if (el   != null) target.el   = el;
    if (dist != null) target.dist = dist;
    target.assemble = 1; Object.assign(cur, target); },
  state: ()=>({ assemble:+cur.assemble.toFixed(3), az:+cur.az.toFixed(3),
                dist:+cur.dist.toFixed(3), radius:+radius.toFixed(1),
                target:{ assemble:+target.assemble.toFixed(3), az:+target.az.toFixed(3),
                         dist:+target.dist.toFixed(3) } })
};
</script>
